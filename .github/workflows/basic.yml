on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, windows-2025 ]
    runs-on: ${{ matrix.os }}
    steps:
      - run: wsl --install -d Ubuntu-26.04
      - run: wsl --distribution Ubuntu-26.04 apt-get update
